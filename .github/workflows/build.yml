name: build-apk
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7", cache-disabled: true }
      - name: Download Stockfish (arm64)
        run: |
          curl -L -o sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-android-armv8.tar
          tar xf sf.tar
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp stockfish/stockfish-android-armv8 app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Build
        run: |
          set +e
          gradle assembleDebug --console=plain --no-daemon > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            m1=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not|Unresolved|SDK" -A2 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GRADLE-ERRORS::$m1"
            m2=$(tail -25 build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GRADLE-TAIL::$m2"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: ChessHint-apk, path: app/build/outputs/apk/debug/app-debug.apk }
