name: build-apk
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Download Stockfish (arm64)
        run: |
          curl -L -o sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-android-armv8.tar
          tar xf sf.tar
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp stockfish/stockfish-android-armv8 app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: ChessHint-apk, path: app/build/outputs/apk/debug/app-debug.apk }
