name: build-apk
on: [push, workflow_dispatch]
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7", cache-disabled: true }
      - name: Download Stockfish (arm64)
        run: |
          curl -L -o sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-android-armv8.tar
          tar xf sf.tar
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp stockfish/stockfish-android-armv8 app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Build
        run: |
          set +e
          for i in 1 2 3; do
            gradle assembleDebug --console=plain --no-daemon > build.log 2>&1
            rc=$?
            [ $rc -eq 0 ] && break
            grep -q "429" build.log || break
            sleep 20
          done
          if [ $rc -ne 0 ]; then
            m1=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not|Unresolved" -A2 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GRADLE-ERRORS::$m1"
            exit 1
          fi
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "build ${{ github.run_number }}" --notes ""
